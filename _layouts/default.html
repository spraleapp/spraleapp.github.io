<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <meta name="apple-itunes-app" content="app-id=1487943646">
    <meta name="theme-color" content="#F3EBD9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1B1713" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="{{ '/assets/img/sprale-icon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Sprale home">
          <img src="{{ '/assets/img/sprale-icon.png' | relative_url }}" alt="" width="36" height="36">
          <span>Sprale</span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="{{ '/#features' | relative_url }}">Features</a>
          <a href="{{ '/#setup' | relative_url }}">Setup</a>
          <a href="{{ '/#faq' | relative_url }}">Help</a>
          <a href="{{ '/privacy-policy/' | relative_url }}">Privacy</a>
        </nav>
        {% include app-store-button.html size="small" %}
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div class="footer-brand">
          <img src="{{ '/assets/img/sprale-icon.png' | relative_url }}" alt="" width="28" height="28">
          <span><strong>Sprale</strong> · Sprache + Lernen</span>
        </div>
        <nav class="footer-nav" aria-label="Footer">
          <a href="{{ '/#faq' | relative_url }}">Help</a>
          <a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy</a>
          <a href="mailto:{{ site.contact_email }}">Contact</a>
        </nav>
        <p class="footer-copy">© {{ site.time | date: '%Y' }} Sprale. Made for readers.</p>
      </div>
    </footer>
  </body>
</html>
